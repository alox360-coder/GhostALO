           "Nuovi lettori di notifiche, nuovi permessi e nuove app installate da APK": "New notification readers, new permissions and new apps installed from APK",
           "A intervalli regolari (di solito 30 minuti, lo cambi in Impostazioni avvisi) l'app controlla in silenzio se è comparso qualcosa di nuovo e ti manda una notifica. Controlla: app spia note, nuovi servizi di accessibilità, nuovi amministratori del dispositivo, nuovi lettori di notifiche e app installate da APK con permessi sensibili. Tutto resta nel telefono.": "At regular intervals (usually 30 minutes, change it in Alert settings) the app silently checks whether anything new has appeared and sends you a notification. It checks: known spy apps, new accessibility services, new device administrators, new notification readers and apps installed from an APK with sensitive permissions. Everything stays on the phone.",
           "Cookie e tracciamento": "Cookies and tracking",
           "COOKIE_E_TRACCIAMENTO": "COOKIES_AND_TRACKING",
           "I cookie stanno dentro ogni browser e Android non permette ad altre app di leggerli o cancellarli. Questa app non può farlo al posto tuo, ma ti porta dove si fa.": "Cookies live inside each browser and Android does not let other apps read or delete them. This app cannot do it for you, but it takes you where it is done.",
           "I TUOI BROWSER": "YOUR BROWSERS",
           "[>] %s\n     apri la scheda: Spazio → Cancella dati": "[>] %s\n     open its page: Storage → Clear data",
           "Nessun browser noto trovato.": "No known browser found.",
           "Attenzione: \"Cancella dati\" elimina anche cronologia e accessi ai siti (ti sloghi ovunque). \"Svuota cache\" invece non tocca gli accessi.": "Warning: \"Clear data\" also deletes history and site logins (you are logged out everywhere). \"Clear cache\" does not touch logins.",
           "CONSIGLI": "TIPS",
           "- Blocca i cookie di terze parti: sono quelli che ti seguono da un sito all'altro. In Chrome: Impostazioni > Privacy e sicurezza > Cookie di terze parti > Blocca.\n- Chrome: usa anche \"Elimina dati di navigazione\" e scegli cookie e dati dei siti.\n- Firefox: Impostazioni > Elimina dati di navigazione all'uscita.\n- Brave e DuckDuckGo bloccano molti tracker già di base.\n- La navigazione in incognito non salva i cookie dopo la chiusura delle schede.": "- Block third-party cookies: they follow you from site to site. In Chrome: Settings > Privacy and security > Third-party cookies > Block.\n- Chrome: also use \"Delete browsing data\" and pick cookies and site data.\n- Firefox: Settings > Delete browsing data on quit.\n- Brave and DuckDuckGo block many trackers by default.\n- Incognito browsing does not keep cookies after the tabs are closed.",
