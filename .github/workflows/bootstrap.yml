          package it.privacycheck

          import android.content.Context
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.net.wifi.WifiInfo
          import android.net.wifi.WifiManager
          import android.os.Build
          import android.provider.Settings

          /** Controllo della rete attuale: protezione del Wi-Fi, VPN, DNS privato. Non usa Internet. */
          @Suppress("DEPRECATION")
          object NetCheck {

              private fun securityName(t: Int): Pair<String, Int>? {
                  if (Build.VERSION.SDK_INT < 31) return null
                  return when (t) {
                      WifiInfo.SECURITY_TYPE_OPEN -> Pair(tr("APERTA (nessuna password, traffico non cifrato dalla rete)"), 3)
                      WifiInfo.SECURITY_TYPE_WEP -> Pair(tr("WEP (vecchia e facilmente violabile)"), 3)
                      WifiInfo.SECURITY_TYPE_PSK -> Pair(tr("WPA/WPA2 con password"), 0)
                      WifiInfo.SECURITY_TYPE_SAE -> Pair(tr("WPA3 con password"), 0)
                      WifiInfo.SECURITY_TYPE_OWE -> Pair(tr("Open cifrata (OWE): senza password ma cifrata"), 0)
                      WifiInfo.SECURITY_TYPE_EAP,
                      WifiInfo.SECURITY_TYPE_EAP_WPA3_ENTERPRISE,
                      WifiInfo.SECURITY_TYPE_EAP_WPA3_ENTERPRISE_192_BIT -> Pair(tr("Aziendale (WPA Enterprise)"), 0)
                      else -> null
                  }
              }

              fun run(ctx: Context): List<Check> {
                  val out = ArrayList<Check>()
                  val cm = ctx.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager

                  var wifi = false
                  var mobile = false
                  var vpn = false
                  try {
                      for (n in cm.allNetworks) {
                          val c = cm.getNetworkCapabilities(n) ?: continue
                          if (c.hasTransport(NetworkCapabilities.TRANSPORT_VPN)) vpn = true
                          if (c.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) &&
                              c.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET) &&
                              !c.hasTransport(NetworkCapabilities.TRANSPORT_VPN)
                          ) wifi = true
                          if (c.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR) &&
                              !c.hasTransport(NetworkCapabilities.TRANSPORT_VPN)
                          ) mobile = true
                      }
                  } catch (e: Exception) {
                      // ignora
                  }

                  var weak = false
                  if (wifi) {
                      var name: Pair<String, Int>? = null
                      try {
                          val wm = ctx.applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                          if (Build.VERSION.SDK_INT >= 31) name = securityName(wm.connectionInfo.currentSecurityType)
                      } catch (e: Exception) {
                          // ignora
                      }
                      if (name == null) {
                          out.add(
                              Check(
                                  1, tr("Wi-Fi: protezione non leggibile"),
                                  tr("Android non dice a questa app che tipo di protezione ha la rete. Controllalo nelle impostazioni Wi-Fi: accanto alla rete deve comparire il lucchetto."),
                                  Settings.ACTION_WIFI_SETTINGS
                              )
                          )
                      } else {
                          if (name.second >= 3) weak = true
                          out.add(Check(name.second, "Wi-Fi: " + name.first, tr("Tocca per aprire le impostazioni Wi-Fi."), Settings.ACTION_WIFI_SETTINGS))
                      }
                  } else if (mobile) {
                      out.add(Check(0, tr("Rete mobile"), tr("Stai usando i dati del telefono: più sicuri di un Wi-Fi sconosciuto."), null))
                  } else {
                      out.add(Check(1, tr("Nessuna rete"), tr("Il telefono non è collegato a Internet."), null))
                  }

                  out.add(
                      if (vpn) {
                          Check(0, tr("VPN attiva"), tr("Il traffico passa da una VPN."), Settings.ACTION_VPN_SETTINGS)
                      } else {
                          Check(1, tr("Nessuna VPN attiva"), tr("Tocca per le impostazioni VPN."), Settings.ACTION_VPN_SETTINGS)
                      }
                  )

                  val dns = Settings.Global.getString(ctx.contentResolver, "private_dns_mode") ?: "opportunistic"
                  out.add(
                      if (dns == "off") {
                          Check(
                              2, tr("DNS privato spento"),
                              tr("Le richieste dei nomi dei siti viaggiano in chiaro sulla rete. Attivalo in Rete e Internet."),
                              Settings.ACTION_WIRELESS_SETTINGS
                          )
                      } else {
                          Check(0, tr("DNS privato"), trf("Modalità: %s.", dns), null)
                      }
                  )

                  // Giudizio complessivo, in cima
                  val verdict = when {
                      wifi && weak && !vpn -> Check(
                          3, tr("SCONSIGLIATO: banca, acquisti e password"),
                          tr("Rete Wi-Fi debole e senza VPN: chi è sulla stessa rete può osservare il traffico. Usa i dati mobili o una VPN di un fornitore affidabile."),
                          null
                      )
                      wifi && !vpn -> Check(
                          1, tr("Se la rete non è tua, valuta una VPN"),
                          tr("Una rete con password condivisa (bar, hotel, ufficio) è comunque usata da molti. I siti con HTTPS restano cifrati, ma chi gestisce la rete vede a quali ti colleghi."),
                          null
                      )
                      wifi && weak && vpn -> Check(
                          2, tr("Rete debole, ma la VPN ti protegge"),
                          tr("Mantieni la VPN accesa finché sei su questa rete."),
                          null
                      )
                      else -> Check(0, tr("Nessun problema evidente"), tr("Dalle impostazioni la rete attuale non mostra segnali di rischio."), null)
                  }
                  out.add(0, verdict)
                  return out
              }
          }
          EOF_PRJ
          mkdir -p "$(dirname 'app/src/main/java/it/privacycheck/SecurityCheck.kt')"
          cat > 'app/src/main/java/it/privacycheck/SecurityCheck.kt' <<'EOF_PRJ'
          package it.privacycheck

          import android.accessibilityservice.AccessibilityServiceInfo
          import android.app.KeyguardManager
          import android.app.admin.DevicePolicyManager
          import android.content.Context
          import android.content.pm.ApplicationInfo
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.os.Build
          import android.provider.Settings
          import android.view.accessibility.AccessibilityManager
          import java.io.File
          import java.time.LocalDate
          import java.time.temporal.ChronoUnit

          /** level: 0 = ok, 1 = info, 2 = attenzione, 3 = problema grave */
          class Check(val level: Int, val title: String, val detail: String, val action: String?)

          class SecurityResult(val score: Int, val checks: List<Check>)

          @Suppress("DEPRECATION")
          object SecurityCheck {

              private val rootPaths = listOf(
                  "/system/bin/su", "/system/xbin/su", "/sbin/su", "/su/bin/su",
                  "/system/sbin/su", "/vendor/bin/su", "/data/local/bin/su",
                  "/data/local/xbin/su", "/system/app/Superuser.apk"
              )

              private val rootPackages = listOf(
                  "com.topjohnwu.magisk", "eu.chainfire.supersu", "com.noshufou.android.su",
                  "com.koushikdutta.superuser", "com.thirdparty.superuser"
              )

              fun run(ctx: Context): SecurityResult {
                  val out = ArrayList<Check>()
                  var penalty = 0
                  val cr = ctx.contentResolver

                  // Blocco schermo
                  val km = ctx.getSystemService(Context.KEYGUARD_SERVICE) as KeyguardManager
                  if (km.isDeviceSecure) {
                      out.add(Check(0, tr("Blocco schermo"), tr("PIN, password o sequenza attivi."), null))
                  } else {
                      penalty += 25
                      out.add(
                          Check(
                              3, tr("Blocco schermo ASSENTE"),
                              tr("Chiunque abbia il telefono in mano può leggere tutto. Imposta un PIN."),
                              Settings.ACTION_SECURITY_SETTINGS
                          )
                      )
                  }

                  // Versione Android
                  val ver = "Android " + Build.VERSION.RELEASE + " (API " + Build.VERSION.SDK_INT + ")"
                  if (Build.VERSION.SDK_INT < 31) {
                      penalty += 10
                      out.add(
                          Check(
                              2, tr("Sistema operativo datato"),
                              ver + tr(": non riceve più aggiornamenti di sicurezza dal produttore."),
                              Settings.ACTION_DEVICE_INFO_SETTINGS
                          )
                      )
                  } else {
                      out.add(Check(0, tr("Versione di Android"), ver, null))
                  }

                  // Patch di sicurezza
                  try {
                      val patch = Build.VERSION.SECURITY_PATCH
                      val days = ChronoUnit.DAYS.between(LocalDate.parse(patch), LocalDate.now())
                      val d = trf("Patch del %s (%s giorni fa).", patch, days)
                      if (days <= 120) {
                          out.add(Check(0, tr("Aggiornamento di sicurezza"), d, null))
                      } else if (days <= 240) {
                          penalty += 10
                          out.add(
                              Check(
                                  2, tr("Aggiornamento di sicurezza non recente"), d + tr(" Cerca aggiornamenti."),
                                  "android.settings.SYSTEM_UPDATE_SETTINGS"
                              )
                          )
                      } else {
                          penalty += 20
                          out.add(
                              Check(
                                  3, tr("Aggiornamento di sicurezza MOLTO vecchio"), d + tr(" Aggiorna il sistema."),
                                  "android.settings.SYSTEM_UPDATE_SETTINGS"
                              )
                          )
                      }
                  } catch (e: Exception) {
                      out.add(Check(1, tr("Aggiornamento di sicurezza"), tr("Data non leggibile."), null))
                  }

                  // Crittografia
                  try {
                      val dpm = ctx.getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
                      val st = dpm.storageEncryptionStatus
                      if (st == DevicePolicyManager.ENCRYPTION_STATUS_ACTIVE ||
                          st == DevicePolicyManager.ENCRYPTION_STATUS_ACTIVE_PER_USER ||
                          st == DevicePolicyManager.ENCRYPTION_STATUS_ACTIVE_DEFAULT_KEY
                      ) {
                          out.add(Check(0, tr("Crittografia dei dati"), tr("Memoria cifrata."), null))
                      } else {
                          penalty += 15
                          out.add(
                              Check(
                                  3, tr("Memoria NON cifrata"), tr("I dati sono leggibili se il telefono viene smontato."),
                                  Settings.ACTION_SECURITY_SETTINGS
                              )
                          )
                      }
                  } catch (e: Exception) {
                      out.add(Check(1, tr("Crittografia dei dati"), tr("Stato non leggibile."), null))
                  }

                  // Debug USB e opzioni sviluppatore
                  val adb = Settings.Global.getInt(cr, Settings.Global.ADB_ENABLED, 0) == 1
                  val dev = Settings.Global.getInt(cr, Settings.Global.DEVELOPMENT_SETTINGS_ENABLED, 0) == 1
                  if (adb) {
                      penalty += 10
                      out.add(
                          Check(
                              2, tr("Debug USB attivo"),
                              tr("Un computer collegato col cavo potrebbe accedere al telefono. Disattivalo se non lo usi."),
                              Settings.ACTION_APPLICATION_DEVELOPMENT_SETTINGS
                          )
                      )
                  } else if (dev) {
                      penalty += 3
                      out.add(
                          Check(
                              1, tr("Opzioni sviluppatore attive"), tr("Il debug USB è spento. Puoi disattivarle."),
                              Settings.ACTION_APPLICATION_DEVELOPMENT_SETTINGS
                          )
                      )
                  } else {
                      out.add(Check(0, tr("Debug USB"), tr("Spento."), null))
                  }

                  // DNS privato
                  val dns = Settings.Global.getString(cr, "private_dns_mode") ?: "opportunistic"
                  if (dns == "off") {
                      penalty += 5
                      out.add(
                          Check(
                              2, tr("DNS privato disattivato"),
                              tr("Le richieste DNS viaggiano in chiaro. Attivalo in Rete e Internet → DNS privato."),
                              Settings.ACTION_WIRELESS_SETTINGS
                          )
                      )
                  } else {
                      out.add(Check(0, tr("DNS privato"), trf("Modalità: %s.", dns), null))
                  }

                  // VPN
                  try {
                      val cm = ctx.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                      val caps = cm.getNetworkCapabilities(cm.activeNetwork)
                      val vpn = caps != null && caps.hasTransport(NetworkCapabilities.TRANSPORT_VPN)
                      if (vpn) {
                          out.add(
                              Check(
                                  0, tr("VPN attiva"),
                                  tr("Il traffico passa da una VPN. Tocca per aprirne le impostazioni."),
                                  Settings.ACTION_VPN_SETTINGS
                              )
                          )
                      } else {
                          out.add(
                              Check(
                                  1, tr("Nessuna VPN attiva"),
                                  tr("Non è obbligatoria, quindi non toglie punti. Su Wi-Fi pubblici ne conviene una di un fornitore affidabile. Tocca per le impostazioni VPN."),
                                  Settings.ACTION_VPN_SETTINGS
                              )
                          )
                      }
                  } catch (e: Exception) {
                      // ignora
                  }

                  // Root
                  var rootSigns = 0
                  for (p in rootPaths) if (File(p).exists()) rootSigns++
                  if (Build.TAGS != null && Build.TAGS.contains("test-keys")) rootSigns++
                  for (p in rootPackages) {
                      try {
                          ctx.packageManager.getPackageInfo(p, 0)
                          rootSigns++
                      } catch (e: Exception) {
                          // non installato
                      }
                  }
                  if (rootSigns > 0) {
                      penalty += 25
                      out.add(
                          Check(
                              3, tr("Segnali di ROOT"),
                              trf("Trovati %s indizi di accesso root o firmware non ufficiale: la sicurezza di Android è indebolita.", rootSigns),
                              null
                          )
                      )
                  } else {
                      out.add(Check(0, "Root", tr("Nessun indizio di root."), null))
                  }

                  // Timeout schermo
                  val to = Settings.System.getInt(cr, Settings.System.SCREEN_OFF_TIMEOUT, 60000)
                  if (to > 120000) {
                      penalty += 3
                      out.add(
                          Check(
                              1, tr("Spegnimento schermo lento"), tr("Lo schermo resta acceso ") + (to / 1000) + tr(" secondi. Meglio 30-60."),
                              Settings.ACTION_DISPLAY_SETTINGS
                          )
                      )
                  } else {
                      out.add(Check(0, tr("Spegnimento schermo"), "" + (to / 1000) + tr(" secondi."), null))
                  }

                  // Accessibilità di terze parti
                  try {
                      val am = ctx.getSystemService(Context.ACCESSIBILITY_SERVICE) as AccessibilityManager
                      var third = 0
                      val names = ArrayList<String>()
                      for (s in am.getEnabledAccessibilityServiceList(AccessibilityServiceInfo.FEEDBACK_ALL_MASK)) {
                          val pkg = s.resolveInfo?.serviceInfo?.packageName ?: continue
                          try {
                              val ai = ctx.packageManager.getApplicationInfo(pkg, 0)
                              if ((ai.flags and ApplicationInfo.FLAG_SYSTEM) == 0) {
                                  third++
                                  names.add(ctx.packageManager.getApplicationLabel(ai).toString())
                              }
                          } catch (e: Exception) {
                              // ignora
                          }
                      }
                      if (third > 0) {
                          penalty += 5
                          out.add(
                              Check(
                                  2, trf("Accessibilità: %s app non di sistema", third),
                                  names.joinToString(", ") + tr(". Possono leggere lo schermo: verifica che le riconosci."),
                                  Settings.ACTION_ACCESSIBILITY_SETTINGS
                              )
                          )
                      } else {
                          out.add(Check(0, tr("Servizi di accessibilità"), tr("Nessuna app di terze parti."), null))
                      }
                  } catch (e: Exception) {
                      // ignora
                  }

                  val score = if (penalty >= 100) 0 else 100 - penalty
                  return SecurityResult(score, out)
              }
          }
          EOF_PRJ
          mkdir -p "$(dirname 'app/src/main/java/it/privacycheck/Stalker.kt')"
          cat > 'app/src/main/java/it/privacycheck/Stalker.kt' <<'EOF_PRJ'
          package it.privacycheck

          import android.content.Context
          import android.content.pm.PackageInfo
          import java.security.MessageDigest

          /**
           * Elenco di indicatori di stalkerware (nomi di pacchetto e impronte SHA-1 delle firme),
           * letto da assets/stalkerware.txt. Condiviso tra la scansione e i controlli in background.
           */
          object Stalker {
              private var pk: Set<String>? = null
              private var ce: Set<String>? = null

              @Synchronized
              fun load(ctx: Context): Pair<Set<String>, Set<String>> {
                  val a = pk
                  val b = ce
                  if (a != null && b != null) return Pair(a, b)
                  val p = HashSet<String>()
                  val c = HashSet<String>()
                  try {
                      val custom = customFile(ctx)
                      val input = if (custom.exists()) custom.inputStream() else ctx.assets.open("stalkerware.txt")
                      input.bufferedReader().useLines { lines ->
                          for (l in lines) {
                              if (l.startsWith("P:")) {
                                  p.add(l.substring(2).trim())
                              } else if (l.startsWith("C:")) {
                                  c.add(l.substring(2).trim().uppercase())
                              }
                          }
                      }
                  } catch (e: Exception) {
                      // elenco non disponibile
                  }
                  pk = p
                  ce = c
                  return Pair(p, c)
              }

              private fun customFile(ctx: Context) = java.io.File(ctx.filesDir, "stalkerware_custom.txt")

              fun isCustom(ctx: Context): Boolean = customFile(ctx).exists()

              /** Legge un elenco dal testo di un file: formato ioc.yaml di Echap o formato P:/C: . */
              fun parse(text: String): Pair<Set<String>, Set<String>> {
                  val p = HashSet<String>()
                  val c = HashSet<String>()
                  var section = ""
                  val pkgRe = Regex("[A-Za-z0-9_.]+")
                  val certRe = Regex("[0-9a-fA-F]{40}")
                  for (raw in text.lineSequence()) {
                      val t = raw.trim()
                      if (t.startsWith("P:")) { val v = t.substring(2).trim(); if (pkgRe.matches(v)) p.add(v); continue }
                      if (t.startsWith("C:")) { val v = t.substring(2).trim(); if (certRe.matches(v)) c.add(v.uppercase()); continue }
                      if (t.startsWith("- name:")) { section = ""; continue }
                      if (t == "packages:") { section = "p"; continue }
                      if (t == "certificates:") { section = "c"; continue }
                      if (t.endsWith(":") && !t.startsWith("-")) { section = "x"; continue }
                      if (t.startsWith("- ")) {
                          val v = t.substring(2).trim().trim('"', '\'')
                          if (section == "p" && pkgRe.matches(v)) p.add(v)
                          if (section == "c" && certRe.matches(v)) c.add(v.uppercase())
                      }
                  }
                  return Pair(p, c)
              }

              /** Importa un elenco da file. Restituisce (app, firme) importate, o null se il file non è valido. */
              @Synchronized
              fun import(ctx: Context, text: String): Pair<Int, Int>? {
                  val (p, c) = parse(text)
                  if (p.size + c.size < 50) return null
                  val sb = StringBuilder("# Elenco importato dall'utente\n")
                  for (x in p.sorted()) sb.append("P:").append(x).append('\n')
                  for (x in c.sorted()) sb.append("C:").append(x).append('\n')
                  customFile(ctx).writeText(sb.toString())
                  pk = null
                  ce = null
                  return Pair(p.size, c.size)
              }

              @Synchronized
              fun resetToBundled(ctx: Context) {
                  customFile(ctx).delete()
                  pk = null
                  ce = null
              }

              fun certHashes(p: PackageInfo): List<String> {
                  val out = ArrayList<String>()
                  try {
                      val si = p.signingInfo ?: return out
                      val sigs = si.apkContentsSigners ?: return out
                      for (s in sigs) {
                          val d = MessageDigest.getInstance("SHA-1").digest(s.toByteArray())
                          out.add(d.joinToString("") { "%02X".format(it) })
                      }
                  } catch (e: Exception) {
                      // ignora
                  }
                  return out
              }
          }
          EOF_PRJ
