           "SCANSIONE_CHAT": "CHAT_SCAN",
           "SCANSIONE_IN_CORSO": "SCAN_IN_PROGRESS",
           "SCANSIONE_PRIVACY": "PRIVACY_SCAN",
           "SCORCIATOIE": "SHORTCUTS",
           "SICUREZZA": "SECURITY",
           "SICUREZZA_DISPOSITIVO": "DEVICE_SECURITY",
           "SPAZIO": "SPACE",
           "SPAZIO OCCUPATO": "SPACE USED",
           "SPAZIO PRIVATO": "PRIVATE SPACE",
           "SPAZIO_PER_TIPO": "SPACE_BY_TYPE",
           "SPAZIO_PRIVATO_E_PROFILI": "PRIVATE_SPACE_AND_PROFILES",
           "STRUMENTI": "TOOLS",
           "Scansione privacy e app spia": "Privacy scan and spy apps",
           "Se l'interruttore è grigio: scheda dell'app → tre puntini → \"Consenti impostazioni con restrizioni\".": "If the switch is gray: app page → three dots → \"Allow restricted settings\".",
           "Se la pagina non si apre o l'interruttore non si accende, prova così:": "If the page does not open or the switch does not turn on, try this:",
           "Senza installare altre app puoi usare un DNS che li filtra: Impostazioni → Rete e Internet → DNS privato → \"Nome host del provider\" e scrivi, per esempio, dns.adguard-dns.com (AdGuard) o adblock.dns.mullvad.net (Mullvad). Verifica il nome sul sito del fornitore. Il fornitore del DNS vede i nomi dei siti che visiti: scegli uno di cui ti fidi.": "Without installing other apps you can use a DNS that filters them: Settings → Network & internet → Private DNS → \"Private DNS provider hostname\" and enter, for example, dns.adguard-dns.com (AdGuard) or adblock.dns.mullvad.net (Mullvad). Check the name on the provider's site. The DNS provider sees the names of the sites you visit: choose one you trust.",
           "Senza questo permesso controllo solo le app, non le cartelle.": "Without this permission I only check apps, not folders.",
           "Serve l'accesso alle statistiche di utilizzo.": "Usage-statistics access is required.",
           "Serve per leggere le cartelle dei media delle chat.": "Needed to read the chat media folders.",
           "Serve per misurare i file presenti nel telefono.": "Needed to measure the files on the phone.",
           "Serve per trovare ed eliminare APK, file temporanei, miniature, cartelle vuote e duplicati.": "Needed to find and delete APKs, temporary files, thumbnails, empty folders and duplicates.",
           "Serve per vedere la cache di ogni app e le app non usate da tempo.": "Needed to see the cache of each app and apps not used for a while.",
           "Servizio di accessibilità attivo (può leggere lo schermo e ciò che scrivi)": "Accessibility service enabled (can read the screen and what you type)",
           "Sicurezza del dispositivo": "Device security",
           "Sistema e altro": "System and other",
           "Sono indizi, non prove: molte app legittime usano questi permessi. Controlla che ti siano familiari e che ti servano.": "These are clues, not proof: many legitimate apps use these permissions. Check that they are familiar and that you need them.",
           "Spazio liberato: ": "Space freed: ",
           "Spazio libero: ": "Free space: ",
           "Spazio non disponibile.": "Space not available.",
           "Spazio privato e profili": "Private Space and profiles",
           "Spunta ciò che vuoi eliminare. Le voci più delicate sono già senza spunta.": "Check what you want to delete. The more delicate items are already unchecked.",
           "Spunta ciò che vuoi eliminare. Sotto ogni voce vedi alcuni esempi.": "Check what you want to delete. Under each item you see a few examples.",
           "Sto cercando i media delle chat…": "Looking for chat media…",
           "Sto chiedendo spazio ad Android… può servire qualche secondo.": "Asking Android for space… it can take a few seconds.",
           "TASTIERE ABILITATE": "ENABLED KEYBOARDS",
           "TRACKER PIU DIFFUSI": "MOST COMMON TRACKERS",
           "Tastiera di terze parti (vede ciò che scrivi)": "Third-party keyboard (sees what you type)",
           "Tocca l'app nell'elenco qui sotto per aprirne la scheda e disinstallarla. ATTENZIONE: se sospetti che l'abbia installata un partner o un familiare violento, rimuoverla potrebbe avvisarlo. Valuta prima di contattare un centro antiviolenza (in Italia: 1522, gratuito e attivo 24 ore su 24).": "Tap the app in the list below to open its page and uninstall it. WARNING: if you suspect it was installed by a violent partner or relative, removing it might alert them. Consider contacting a domestic-violence support center first (in Italy: 1522, free and open 24 hours a day).",
           "Tocca un'app per aprire la sua scheda.": "Tap an app to open its page.",
           "Tocca un'app per aprire la sua scheda. Se non la riconosci, controlla da dove viene e valuta di disinstallarla.": "Tap an app to open its page. If you do not recognize it, check where it comes from and consider uninstalling it.",
           "Tocca un'app per aprirne la scheda.": "Tap an app to open its page.",
           "Tocca una riga con [!!] o [XX] per aprire l'impostazione relativa.": "Tap a row with [!!] or [XX] to open the related setting.",
           "Tocca una riga per aprire la scheda o l'impostazione.": "Tap a row to open the page or the setting.",
           "Trova in WhatsApp, WhatsApp Business e Telegram i media vecchi, le note vocali, le copie dei file inviati e gli stati già visti. Vedi l'elenco e confermi tu prima di eliminare.": "Finds in WhatsApp, WhatsApp Business and Telegram old media, voice notes, copies of sent files and statuses already viewed. You see the list and confirm before deleting.",
           "Ultimo controllo: ": "Last check: ",
           "Un APK senza segnalazioni non è garantito sicuro: scarica app solo da fonti che conosci. Per eliminare i vecchi APK usa [4] Pulizia.": "An APK with no warnings is not guaranteed safe: download apps only from sources you know. To delete old APKs use [4] Cleaning.",
           "Un risultato pulito non garantisce che non ci sia nulla: le app ben nascoste (per esempio con accesso root) sfuggono a qualsiasi app normale.": "A clean result does not guarantee that there is nothing: well-hidden apps (for example with root access) escape any normal app.",
           "Un tracker non significa spionaggio: molte app gratuite li usano per pubblicità e statistiche. Se un'app ne ha molti e non ti serve, valuta di disinstallarla. Il rilevamento si basa sui nomi delle librerie: le app \"offuscate\" possono sfuggire.": "A tracker does not mean spying: many free apps use them for ads and statistics. If an app has many and you do not need it, consider uninstalling it. Detection is based on library names: \"obfuscated\" apps may escape.",
           "Uno Spazio privato bloccato non è visibile alle app: potrebbe esistere anche se qui non compare.": "A locked Private Space is not visible to apps: it may exist even if it does not appear here.",
           "Valori indicativi: i dati privati delle app e il sistema non sono misurabili con precisione, e i file possono essere contati anche nelle app.": "Indicative values: apps' private data and the system cannot be measured precisely, and files may also be counted inside apps.",
