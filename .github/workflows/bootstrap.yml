          mkdir -p "$(dirname 'fastlane/metadata/android/it-IT/short_description.txt')"
          cat > 'fastlane/metadata/android/it-IT/short_description.txt' <<'EOF_PRJ'
          Controlla privacy e app spia del telefono e fai pulizia, senza Internet
          EOF_PRJ
          mkdir -p "$(dirname 'fastlane/metadata/android/it-IT/title.txt')"
          cat > 'fastlane/metadata/android/it-IT/title.txt' <<'EOF_PRJ'
          GhostALO
          EOF_PRJ

      - name: Crea il wrapper di Gradle
        run: |
          mkdir -p "$RUNNER_TEMP/w"
          touch "$RUNNER_TEMP/w/settings.gradle"
          (cd "$RUNNER_TEMP/w" && gradle wrapper --distribution-type bin --no-daemon)
          cp "$RUNNER_TEMP/w/gradlew" "$RUNNER_TEMP/w/gradlew.bat" .
          mkdir -p gradle/wrapper
          cp "$RUNNER_TEMP/w/gradle/wrapper/"* gradle/wrapper/
          chmod +x gradlew

      - name: Salva nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git update-index --chmod=+x gradlew
          git commit -m "Aggiorna il progetto Controllo Privacy" || echo "Nessuna modifica da salvare"
          git push

      - name: Avvia la compilazione
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main
