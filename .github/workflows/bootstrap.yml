           "Per mettere una tessera piccola sulla Home: tieni premuto su uno spazio vuoto, scegli Widget e cerca \"GhostALO (icona piccola)\": occupa un solo riquadro e mostra OK, !! o XX. La versione \"esteso\" mostra più dettagli e il tasto [R]. L'icona normale dell'app si trascina dal menu delle app.": "To put a small tile on the Home screen: long-press an empty spot, choose Widgets and look for \"GhostALO (small icon)\": it takes a single square and shows OK, !! or XX. The \"extended\" version shows more details and the [R] button. The normal app icon can be dragged from the app drawer.",
