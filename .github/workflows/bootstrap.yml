           "È un controllo di indizi, non un antivirus: non garantisce che il telefono sia pulito.": "This is a check for clues, not an antivirus: it does not guarantee the phone is clean.",
           "• Non può leggere i dati di altre app né vedere in tempo reale chi usa fotocamera e microfono.\n• Non può svuotare la cache o la cronologia di altre app: Android lo vieta.\n• Non è un antivirus: confronta app e firme con un elenco noto e cerca indizi.\n• I risultati sono indizi, non prove.\n• Se sospetti un controllo nascosto, il ripristino di fabbrica è la soluzione più sicura (salva prima i dati e cambia le password da un altro dispositivo).": "• It cannot read other apps' data or see in real time who uses camera and microphone.\n• It cannot clear the cache or history of other apps: Android forbids it.\n• It is not an antivirus: it compares apps and signatures against a known list and looks for clues.\n• Results are clues, not proof.\n• If you suspect hidden monitoring, a factory reset is the safest solution (back up your data first and change your passwords from another device).",
