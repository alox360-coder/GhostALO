              /** Avvia un lavoro in secondo piano; il precedente viene fermato. */
              private fun work(block: () -> Unit) {
                  worker?.interrupt()
                  val t = Thread {
                      try {
                          block()
                      } catch (e: java.util.concurrent.CancellationException) {
                          // scansione annullata dall'utente
                      }
