                              backButton()
                          }
                      }
                  }.start()
              }

              // ---------- Scansione privacy: logica ----------

              private fun loadStalker() {
                  if (spyPk != null && spyCert != null) return
                  val p = HashSet<String>()
                  val c = HashSet<String>()
                  try {
                      assets.open("stalkerware.txt").bufferedReader().useLines { lines ->
                          for (l in lines) {
                              if (l.startsWith("P:")) {
                                  p.add(l.substring(2).trim())
                              } else if (l.startsWith("C:")) {
                                  c.add(l.substring(2).trim().uppercase())
                              }
                          }
                      }
                  } catch (e: Exception) {
                      // elenco non disponibile
                  }
                  spyPk = p
                  spyCert = c
              }

              private fun certHashes(p: PackageInfo): List<String> {
                  val out = ArrayList<String>()
                  try {
                      val si = p.signingInfo ?: return out
                      val sigs = si.apkContentsSigners ?: return out
                      for (s in sigs) {
                          val d = MessageDigest.getInstance("SHA-1").digest(s.toByteArray())
                          out.add(d.joinToString("") { "%02X".format(it) })
                      }
                  } catch (e: Exception) {
                      // ignora
                  }
                  return out
              }

              private fun isSystem(ai: ApplicationInfo): Boolean =
                  (ai.flags and ApplicationInfo.FLAG_SYSTEM) != 0

              private fun nameOf(pkg: String): Pair<String, Boolean> {
                  return try {
                      val ai = packageManager.getApplicationInfo(pkg, 0)
                      Pair(packageManager.getApplicationLabel(ai).toString(), isSystem(ai))
                  } catch (e: Exception) {
                      Pair(pkg, false)
                  }
              }

              private fun grantedPerms(p: PackageInfo): Set<String> {
                  val req = p.requestedPermissions ?: return emptySet()
                  val fl = p.requestedPermissionsFlags ?: return emptySet()
                  val out = HashSet<String>()
                  for (i in req.indices) {
                      if (i < fl.size && (fl[i] and PackageInfo.REQUESTED_PERMISSION_GRANTED) != 0) {
                          out.add(req[i])
                      }
                  }
                  return out
              }

              private fun scan(): Report {
                  val pm = packageManager
                  loadStalker()
                  val spyP = spyPk ?: emptySet<String>()
                  val spyC = spyCert ?: emptySet<String>()

                  // Servizi di accessibilità attivi
                  val am = getSystemService(Context.ACCESSIBILITY_SERVICE) as AccessibilityManager
                  val accPk = am.getEnabledAccessibilityServiceList(AccessibilityServiceInfo.FEEDBACK_ALL_MASK)
                      .mapNotNull { it.resolveInfo?.serviceInfo?.packageName }
                      .toSet()

                  // Amministratori del dispositivo
                  val dpm = getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
                  val admins = dpm.activeAdmins
                  val adminPk = HashSet<String>()
                  if (admins != null) {
                      for (c in admins) adminPk.add(c.packageName)
                  }

                  // Lettori di notifiche
                  val nl = Settings.Secure.getString(contentResolver, "enabled_notification_listeners") ?: ""
                  val nlPk = nl.split(":")
                      .mapNotNull { ComponentName.unflattenFromString(it)?.packageName }
                      .toSet()

                  // Tastiere
                  val imm = getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager
                  val imePk = imm.enabledInputMethodList.map { it.packageName }.toSet()
                  val defIme = (Settings.Secure.getString(contentResolver, Settings.Secure.DEFAULT_INPUT_METHOD) ?: "")
                      .substringBefore("/")

                  // App installate (con permessi e firme)
                  val flags = PackageManager.GET_PERMISSIONS or PackageManager.GET_SIGNING_CERTIFICATES
                  val pkgs: List<PackageInfo> = if (Build.VERSION.SDK_INT >= 33) {
                      pm.getInstalledPackages(PackageManager.PackageInfoFlags.of(flags.toLong()))
                  } else {
                      pm.getInstalledPackages(flags)
                  }

                  val flagged = ArrayList<AppFinding>()
                  val spyHits = ArrayList<String>()
                  val cam = ArrayList<String>()
                  val mic = ArrayList<String>()
                  var quiet = 0

                  for (p in pkgs) {
                      val ai = p.applicationInfo ?: continue
                      if (p.packageName == packageName) continue

                      val sys = isSystem(ai)
                      val byPkg = p.packageName in spyP
                      var byCert = false
                      if (!sys && !byPkg && spyC.isNotEmpty()) {
                          byCert = certHashes(p).any { it in spyC }
                      }
                      if (sys && !byPkg) continue

                      val label = pm.getApplicationLabel(ai).toString()
                      val granted = grantedPerms(p)
                      val reasons = ArrayList<String>()
                      var score = 0

                      if (byPkg) {
                          score += 10
                          reasons.add("APP SPIA NOTA: il pacchetto è nell'elenco pubblico di stalkerware")
                          spyHits.add(label + " (" + p.packageName + ")")
                      }
                      if (byCert) {
                          score += 10
                          reasons.add("APP SPIA NOTA: firmata con una chiave usata da stalkerware noti")
                          spyHits.add(label + " (" + p.packageName + ")")
                      }
                      if (p.packageName in accPk) {
                          score += 4
                          reasons.add("Servizio di accessibilità attivo (può leggere lo schermo e ciò che scrivi)")
                      }
                      if (p.packageName in adminPk) {
                          score += 4
                          reasons.add("Amministratore del dispositivo (difficile da rimuovere)")
                      }
                      if (p.packageName in nlPk) {
                          score += 2
                          reasons.add("Può leggere tutte le notifiche")
                      }
                      if (p.packageName in imePk) {
                          score += 1
                          reasons.add("Tastiera di terze parti (vede ciò che scrivi)")
                      }
                      if (Manifest.permission.CAMERA in granted) {
                          score += 1
                          reasons.add("Accesso alla fotocamera")
                          if (!sys) cam.add(label)
                      }
                      if (Manifest.permission.RECORD_AUDIO in granted) {
                          score += 1
                          reasons.add("Accesso al microfono")
                          if (!sys) mic.add(label)
                      }
                      if (Manifest.permission.READ_SMS in granted) {
                          score += 2
                          reasons.add("Può leggere gli SMS")
                      }
                      if (Manifest.permission.READ_CALL_LOG in granted) {
                          score += 2
                          reasons.add("Può leggere il registro chiamate")
                      }
                      val installer = try {
                          pm.getInstallSourceInfo(p.packageName).installingPackageName
                      } catch (e: Exception) {
                          null
                      }
                      if (!sys && (installer == null || installer !in storeInstallers)) {
                          score += 2
                          reasons.add("Installata fuori da un negozio ufficiale (APK manuale)")
                      }

                      if (score >= 2) {
                          flagged.add(AppFinding(p.packageName, label, score, reasons))
                      } else {
                          quiet++
                      }
                  }
                  flagged.sortByDescending { it.score }
                  cam.sort()
                  mic.sort()

                  val accLines = accPk.map {
                      val (n, sys) = nameOf(it)
                      if (sys) "$n (app di sistema)" else "$n (app installata da te o da altri)"
                  }
                  val keyboardLines = imePk.map {
                      val (n, sys) = nameOf(it)
                      val kind = if (sys) "di sistema" else "di terze parti"
                      val def = if (it == defIme) ", in uso" else ""
                      "$n ($kind$def)"
                  }

                  return Report(
                      flagged = flagged,
                      quietCount = quiet,
                      camApps = cam,
                      micApps = mic,
                      accLines = accLines,
                      keyboardLines = keyboardLines,
                      photoLines = scanPhotos(),
                      bigFiles = bigFiles(),
                      storageLine = storageLine(),
                      spyHits = spyHits.distinct(),
                      stalkerDbSize = spyP.size + spyC.size
                  )
              }

              private fun hasMedia(): Boolean {
                  val perm = if (Build.VERSION.SDK_INT >= 33) {
                      Manifest.permission.READ_MEDIA_IMAGES
                  } else {
                      Manifest.permission.READ_EXTERNAL_STORAGE
                  }
                  return checkSelfPermission(perm) == PackageManager.PERMISSION_GRANTED
              }

              private fun scanPhotos(): List<String>? {
                  if (!hasMedia()) return null
                  val camPk = try {
                      packageManager.queryIntentActivities(Intent(MediaStore.ACTION_IMAGE_CAPTURE), 0)
                          .map { it.activityInfo.packageName }
                          .toSet()
                  } catch (e: Exception) {
                      emptySet<String>()
                  }
                  val counts = HashMap<String, Int>()
                  val last = HashMap<String, Long>()
                  try {
                      val proj = arrayOf(
                          MediaStore.Images.Media.OWNER_PACKAGE_NAME,
                          MediaStore.Images.Media.DATE_ADDED
                      )
                      val cursor = contentResolver.query(
                          MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                          proj,
                          null,
                          null,
                          MediaStore.Images.Media.DATE_ADDED + " DESC"
                      )
                      if (cursor != null) {
                          cursor.use { c ->
                              var n = 0
                              while (c.moveToNext() && n < 20000) {
                                  n++
                                  val owner = c.getString(0)
                                  if (owner == null) continue
                                  val lower = owner.lowercase()
                                  if (owner in camPk || lower.contains("camera") ||
                                      lower.contains("systemui") || lower.contains("gallery") ||
                                      lower.contains("photos")
                                  ) continue
                                  counts[owner] = (counts[owner] ?: 0) + 1
                                  if (!last.containsKey(owner)) last[owner] = c.getLong(1)
                              }
                          }
                      }
                  } catch (e: Exception) {
                      return emptyList()
                  }
                  return counts.entries
                      .sortedByDescending { it.value }
                      .take(10)
                      .map {
                          val (n, _) = nameOf(it.key)
                          val d = DateFormat.format("dd/MM/yyyy HH:mm", Date((last[it.key] ?: 0L) * 1000L))
                          "$n: ${it.value} foto, ultima il $d"
                      }
              }

              private fun bigFiles(): List<String>? {
                  if (!hasMedia()) return null
                  val out = ArrayList<String>()
                  try {
                      val proj = arrayOf(MediaStore.MediaColumns.DISPLAY_NAME, MediaStore.MediaColumns.SIZE)
                      val cursor = contentResolver.query(
                          MediaStore.Files.getContentUri("external"),
                          proj,
                          null,
                          null,
                          MediaStore.MediaColumns.SIZE + " DESC"
                      )
                      if (cursor != null) {
                          cursor.use { c ->
                              var n = 0
                              while (c.moveToNext() && n < 12) {
                                  val name = c.getString(0) ?: "(senza nome)"
                                  val size = c.getLong(1)
                                  out.add(name + " — " + Formatter.formatFileSize(this, size))
                                  n++
                              }
                          }
                      }
                  } catch (e: Exception) {
                      // ignora
                  }
                  return out
              }

              private fun storageLine(): String {
                  return try {
                      val sf = StatFs(Environment.getDataDirectory().path)
                      val total = sf.totalBytes
                      val free = sf.availableBytes
                      "Spazio libero: " + Formatter.formatFileSize(this, free) +
                          " su " + Formatter.formatFileSize(this, total)
                  } catch (e: Exception) {
                      "Spazio non disponibile."
                  }
              }
          }
          EOF_PRJ
          mkdir -p "$(dirname 'app/src/main/java/it/privacycheck/SecurityCheck.kt')"
          cat > 'app/src/main/java/it/privacycheck/SecurityCheck.kt' <<'EOF_PRJ'
          package it.privacycheck

          import android.accessibilityservice.AccessibilityServiceInfo
          import android.app.KeyguardManager
          import android.app.admin.DevicePolicyManager
          import android.content.Context
          import android.content.pm.ApplicationInfo
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.os.Build
          import android.provider.Settings
          import android.view.accessibility.AccessibilityManager
          import java.io.File
          import java.time.LocalDate
          import java.time.temporal.ChronoUnit

          /** level: 0 = ok, 1 = info, 2 = attenzione, 3 = problema grave */
          class Check(val level: Int, val title: String, val detail: String, val action: String?)

          class SecurityResult(val score: Int, val checks: List<Check>)

          @Suppress("DEPRECATION")
          object SecurityCheck {

              private val rootPaths = listOf(
                  "/system/bin/su", "/system/xbin/su", "/sbin/su", "/su/bin/su",
                  "/system/sbin/su", "/vendor/bin/su", "/data/local/bin/su",
                  "/data/local/xbin/su", "/system/app/Superuser.apk"
              )

              private val rootPackages = listOf(
                  "com.topjohnwu.magisk", "eu.chainfire.supersu", "com.noshufou.android.su",
                  "com.koushikdutta.superuser", "com.thirdparty.superuser"
              )

              fun run(ctx: Context): SecurityResult {
                  val out = ArrayList<Check>()
                  var penalty = 0
                  val cr = ctx.contentResolver

                  // Blocco schermo
                  val km = ctx.getSystemService(Context.KEYGUARD_SERVICE) as KeyguardManager
                  if (km.isDeviceSecure) {
                      out.add(Check(0, "Blocco schermo", "PIN, password o sequenza attivi.", null))
                  } else {
                      penalty += 25
                      out.add(
                          Check(
                              3, "Blocco schermo ASSENTE",
                              "Chiunque abbia il telefono in mano può leggere tutto. Imposta un PIN.",
                              Settings.ACTION_SECURITY_SETTINGS
                          )
                      )
                  }

                  // Versione Android
                  val ver = "Android " + Build.VERSION.RELEASE + " (API " + Build.VERSION.SDK_INT + ")"
                  if (Build.VERSION.SDK_INT < 31) {
                      penalty += 10
                      out.add(
                          Check(
                              2, "Sistema operativo datato",
                              ver + ": non riceve più aggiornamenti di sicurezza dal produttore.",
                              Settings.ACTION_DEVICE_INFO_SETTINGS
                          )
                      )
                  } else {
                      out.add(Check(0, "Versione di Android", ver, null))
                  }

                  // Patch di sicurezza
                  try {
                      val patch = Build.VERSION.SECURITY_PATCH
                      val days = ChronoUnit.DAYS.between(LocalDate.parse(patch), LocalDate.now())
                      val d = "Patch del $patch ($days giorni fa)."
                      if (days <= 120) {
                          out.add(Check(0, "Aggiornamento di sicurezza", d, null))
                      } else if (days <= 240) {
                          penalty += 10
                          out.add(
                              Check(
                                  2, "Aggiornamento di sicurezza non recente", d + " Cerca aggiornamenti.",
                                  "android.settings.SYSTEM_UPDATE_SETTINGS"
                              )
                          )
                      } else {
                          penalty += 20
                          out.add(
                              Check(
                                  3, "Aggiornamento di sicurezza MOLTO vecchio", d + " Aggiorna il sistema.",
                                  "android.settings.SYSTEM_UPDATE_SETTINGS"
                              )
                          )
                      }
                  } catch (e: Exception) {
                      out.add(Check(1, "Aggiornamento di sicurezza", "Data non leggibile.", null))
                  }

                  // Crittografia
                  try {
                      val dpm = ctx.getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
                      val st = dpm.storageEncryptionStatus
                      if (st == DevicePolicyManager.ENCRYPTION_STATUS_ACTIVE ||
                          st == DevicePolicyManager.ENCRYPTION_STATUS_ACTIVE_PER_USER ||
                          st == DevicePolicyManager.ENCRYPTION_STATUS_ACTIVE_DEFAULT_KEY
                      ) {
                          out.add(Check(0, "Crittografia dei dati", "Memoria cifrata.", null))
                      } else {
                          penalty += 15
                          out.add(
                              Check(
                                  3, "Memoria NON cifrata", "I dati sono leggibili se il telefono viene smontato.",
                                  Settings.ACTION_SECURITY_SETTINGS
                              )
                          )
                      }
                  } catch (e: Exception) {
                      out.add(Check(1, "Crittografia dei dati", "Stato non leggibile.", null))
                  }

                  // Debug USB e opzioni sviluppatore
                  val adb = Settings.Global.getInt(cr, Settings.Global.ADB_ENABLED, 0) == 1
                  val dev = Settings.Global.getInt(cr, Settings.Global.DEVELOPMENT_SETTINGS_ENABLED, 0) == 1
                  if (adb) {
                      penalty += 10
                      out.add(
                          Check(
                              2, "Debug USB attivo",
                              "Un computer collegato col cavo potrebbe accedere al telefono. Disattivalo se non lo usi.",
                              Settings.ACTION_APPLICATION_DEVELOPMENT_SETTINGS
                          )
                      )
                  } else if (dev) {
                      penalty += 3
                      out.add(
                          Check(
                              1, "Opzioni sviluppatore attive", "Il debug USB è spento. Puoi disattivarle.",
                              Settings.ACTION_APPLICATION_DEVELOPMENT_SETTINGS
                          )
                      )
                  } else {
                      out.add(Check(0, "Debug USB", "Spento.", null))
                  }

                  // DNS privato
                  val dns = Settings.Global.getString(cr, "private_dns_mode") ?: "opportunistic"
                  if (dns == "off") {
                      penalty += 5
                      out.add(
                          Check(
                              2, "DNS privato disattivato",
                              "Le richieste DNS viaggiano in chiaro. Attivalo in Rete e Internet → DNS privato.",
                              Settings.ACTION_WIRELESS_SETTINGS
                          )
                      )
                  } else {
                      out.add(Check(0, "DNS privato", "Modalità: $dns.", null))
                  }

                  // VPN
                  try {
                      val cm = ctx.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                      val caps = cm.getNetworkCapabilities(cm.activeNetwork)
                      val vpn = caps != null && caps.hasTransport(NetworkCapabilities.TRANSPORT_VPN)
                      out.add(Check(1, "VPN", if (vpn) "Una VPN è attiva ora." else "Nessuna VPN attiva ora.", null))
                  } catch (e: Exception) {
                      // ignora
                  }

                  // Root
                  var rootSigns = 0
                  for (p in rootPaths) if (File(p).exists()) rootSigns++
                  if (Build.TAGS != null && Build.TAGS.contains("test-keys")) rootSigns++
                  for (p in rootPackages) {
                      try {
                          ctx.packageManager.getPackageInfo(p, 0)
                          rootSigns++
                      } catch (e: Exception) {
                          // non installato
                      }
                  }
                  if (rootSigns > 0) {
                      penalty += 25
                      out.add(
                          Check(
                              3, "Segnali di ROOT",
                              "Trovati $rootSigns indizi di accesso root o firmware non ufficiale: la sicurezza di Android è indebolita.",
                              null
                          )
                      )
                  } else {
                      out.add(Check(0, "Root", "Nessun indizio di root.", null))
                  }

                  // Timeout schermo
                  val to = Settings.System.getInt(cr, Settings.System.SCREEN_OFF_TIMEOUT, 60000)
                  if (to > 120000) {
                      penalty += 3
                      out.add(
                          Check(
                              2, "Spegnimento schermo lento", "Lo schermo resta acceso " + (to / 1000) + " secondi. Meglio 30-60.",
                              Settings.ACTION_DISPLAY_SETTINGS
                          )
                      )
                  } else {
                      out.add(Check(0, "Spegnimento schermo", "" + (to / 1000) + " secondi.", null))
                  }

                  // Accessibilità di terze parti
                  try {
                      val am = ctx.getSystemService(Context.ACCESSIBILITY_SERVICE) as AccessibilityManager
                      var third = 0
                      val names = ArrayList<String>()
                      for (s in am.getEnabledAccessibilityServiceList(AccessibilityServiceInfo.FEEDBACK_ALL_MASK)) {
                          val pkg = s.resolveInfo?.serviceInfo?.packageName ?: continue
                          try {
                              val ai = ctx.packageManager.getApplicationInfo(pkg, 0)
                              if ((ai.flags and ApplicationInfo.FLAG_SYSTEM) == 0) {
                                  third++
                                  names.add(ctx.packageManager.getApplicationLabel(ai).toString())
                              }
                          } catch (e: Exception) {
                              // ignora
                          }
                      }
                      if (third > 0) {
                          penalty += 5
                          out.add(
                              Check(
                                  2, "Accessibilità: $third app non di sistema",
                                  names.joinToString(", ") + ". Possono leggere lo schermo: verifica che le riconosci.",
                                  Settings.ACTION_ACCESSIBILITY_SETTINGS
                              )
                          )
                      } else {
                          out.add(Check(0, "Servizi di accessibilità", "Nessuna app di terze parti.", null))
                      }
                  } catch (e: Exception) {
                      // ignora
                  }

                  val score = if (penalty >= 100) 0 else 100 - penalty
                  return SecurityResult(score, out)
              }
          }
          EOF_PRJ
          mkdir -p "$(dirname 'app/src/main/java/it/privacycheck/Trackers.kt')"
          cat > 'app/src/main/java/it/privacycheck/Trackers.kt' <<'EOF_PRJ'
          package it.privacycheck

          import android.content.Context
          import android.content.pm.ApplicationInfo
          import java.util.zip.ZipFile

          class AppTrackers(val pkg: String, val label: String, val trackers: Set<String>)

          class TrackerResult(val analyzed: Int, val apps: List<AppTrackers>)

          private class Node {
              val next = arrayOfNulls<Node>(128)
              var name: String? = null
          }

          /**
           * Cerca nel codice (file classes*.dex) delle app installate i nomi delle librerie
           * pubblicitarie e di tracciamento più diffuse. Funziona interamente offline.
           */
          @Suppress("DEPRECATION")
          object Trackers {

              private val list = listOf(
                  "Google Analytics" to "com/google/android/gms/analytics/",
                  "Google Tag Manager" to "com/google/android/gms/tagmanager/",
                  "Firebase Analytics" to "com/google/firebase/analytics/",
                  "Google AdMob / Ads" to "com/google/android/gms/ads/",
                  "Firebase Crashlytics" to "com/google/firebase/crashlytics/",
                  "Crashlytics (Fabric)" to "com/crashlytics/android/",
                  "Facebook Ads" to "com/facebook/ads/",
                  "Facebook Analytics" to "com/facebook/appevents/",
                  "Facebook SDK" to "com/facebook/FacebookSdk",
                  "Flurry" to "com/flurry/",
                  "AppsFlyer" to "com/appsflyer/",
                  "Adjust" to "com/adjust/sdk/",
                  "Branch" to "io/branch/",
                  "Mixpanel" to "com/mixpanel/",
                  "Amplitude" to "com/amplitude/",
                  "Segment" to "com/segment/analytics/",
                  "OneSignal" to "com/onesignal/",
                  "Unity Ads" to "com/unity3d/ads/",
                  "AppLovin" to "com/applovin/",
                  "ironSource" to "com/ironsource/",
                  "Vungle" to "com/vungle/",
                  "Chartboost" to "com/chartboost/",
                  "InMobi" to "com/inmobi/",
                  "MoPub" to "com/mopub/",
                  "StartApp" to "com/startapp/",
                  "Tapjoy" to "com/tapjoy/",
                  "Pangle (TikTok Ads)" to "com/bytedance/sdk/openadsdk/",
                  "Kochava" to "com/kochava/",
                  "Singular" to "com/singular/sdk/",
                  "Braze (Appboy)" to "com/appboy/",
                  "Braze" to "com/braze/",
                  "Urban Airship" to "com/urbanairship/",
                  "MoEngage" to "com/moengage/",
                  "CleverTap" to "com/clevertap/",
                  "Yandex Metrica" to "com/yandex/metrica/",
                  "myTracker (VK)" to "com/my/tracker/",
                  "Smaato" to "com/smaato/",
                  "Fyber" to "com/fyber/",
                  "AdColony" to "com/adcolony/",
                  "Criteo" to "com/criteo/",
                  "Taboola" to "com/taboola/",
                  "Outbrain" to "com/outbrain/",
                  "comScore" to "com/comscore/",
                  "Huawei Analytics" to "com/huawei/hms/analytics/",
                  "Huawei Ads" to "com/huawei/hms/ads/",
                  "Microsoft AppCenter" to "com/microsoft/appcenter/",
                  "Bugsnag" to "com/bugsnag/",
                  "Adobe Analytics" to "com/adobe/mobile/",
                  "Tune" to "com/tune/",
                  "Leanplum" to "com/leanplum/",
                  "Optimizely" to "com/optimizely/"
              )

              private val root: Node = buildTrie()

              private fun buildTrie(): Node {
                  val r = Node()
                  for ((name, prefix) in list) {
                      var n = r
                      for (ch in prefix) {
                          val c = ch.code
                          if (c >= 128) continue
                          var nx = n.next[c]
                          if (nx == null) {
                              nx = Node()
                              n.next[c] = nx
                          }
                          n = nx
                      }
                      n.name = name
                  }
                  return r
              }

              private fun scanBytes(buf: ByteArray, found: MutableSet<String>) {
                  val big = 'L'.code.toByte()
                  val n = buf.size
                  var i = 0
                  while (i < n) {
                      if (buf[i] == big) {
                          var node = root
                          var j = i + 1
                          while (j < n) {
                              val b = buf[j].toInt()
                              if (b < 0) break
                              val nx = node.next[b] ?: break
                              node = nx
                              val nm = node.name
                              if (nm != null) {
                                  found.add(nm)
                                  break
                              }
                              j++
                          }
                      }
                      i++
                  }
              }

              private fun scanApk(path: String): Set<String> {
                  val found = HashSet<String>()
                  try {
                      ZipFile(path).use { zf ->
                          val en = zf.entries()
                          while (en.hasMoreElements()) {
                              val e = en.nextElement()
                              val nm = e.name
                              if (nm.startsWith("classes") && nm.endsWith(".dex") && e.size in 1L..60000000L) {
                                  val data = zf.getInputStream(e).use { it.readBytes() }
                                  scanBytes(data, found)
                              }
                          }
                      }
                  } catch (e: Exception) {
                      // APK non leggibile
                  }
                  return found
              }

              fun scanAll(ctx: Context, progress: (Int, Int) -> Unit): TrackerResult {
                  val pm = ctx.packageManager
                  val apps = pm.getInstalledApplications(0).filter {
                      (it.flags and ApplicationInfo.FLAG_SYSTEM) == 0 && it.packageName != ctx.packageName
                  }
                  val out = ArrayList<AppTrackers>()
                  var done = 0
                  for (ai in apps) {
                      val found = scanApk(ai.sourceDir)
                      out.add(AppTrackers(ai.packageName, pm.getApplicationLabel(ai).toString(), found))
                      done++
                      progress(done, apps.size)
                  }
                  return TrackerResult(apps.size, out)
              }
          }
