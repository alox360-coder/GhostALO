           "PUNTEGGIO: ": "SCORE: ",
           "Per ogni permesso vedi quali app installate da te lo hanno ottenuto. Tocca una voce, poi un'app: si apre la sua scheda, dove puoi togliere il permesso (Autorizzazioni). Questa app non può revocare i permessi delle altre, lo decidi tu.": "For each permission you see which apps installed by you have it. Tap an entry, then an app: its page opens, where you can remove the permission (Permissions). This app cannot revoke other apps' permissions: you decide.",
           "Per questo controllo serve il permesso di leggere le foto. Rilancia il controllo e concedilo.": "This check needs permission to read photos. Run the check again and grant it.",
           "Per vedere la cache delle app concedi l'accesso alle statistiche di utilizzo.": "To see app cache, grant usage-statistics access.",
           "Periodo da controllare:": "Period to check:",
           "Permessi: chi usa cosa": "Permissions: who uses what",
           "Posizione": "Location",
           "Posizione in background": "Background location",
           "Possono leggere lo schermo e ciò che scrivi. Normali per app come TalkBack; sospetti se non li hai attivati tu.": "They can read the screen and what you type. Normal for apps such as TalkBack; suspicious if you did not enable them.",
           "Prima consenti le notifiche.": "First allow notifications.",
           "Pulizia WhatsApp e Telegram": "WhatsApp and Telegram cleaning",
           "Pulizia file e cache": "File and cache cleaning",
           "Punteggio sicurezza dispositivo: ": "Device security score: ",
           "Puoi svuotare la cache a mano: tocca un'app nell'elenco di Pulizia, poi Archiviazione → Svuota cache.": "You can clear the cache by hand: tap an app in the Cleaning list, then Storage → Clear cache.",
           "Può leggere gli SMS": "Can read SMS",
           "Può leggere il registro chiamate": "Can read the call log",
           "Può leggere tutte le notifiche": "Can read all notifications",
           "Può richiedere anche un minuto se hai molti file.": "It can take a minute if you have many files.",
           "Può richiedere anche un minuto.": "It can take a minute.",
           "Può richiedere qualche secondo.": "It can take a few seconds.",
           "Quando un'app ha usato fotocamera, microfono o posizione lo sa solo Android: dal 12 in poi c'è un registro nelle impostazioni, che questa app non può leggere.": "Only Android knows when an app used camera, microphone or location: from Android 12 on there is a log in settings, which this app cannot read.",
           "Questa app usa solo le funzioni ufficiali di Android. Non ha il permesso Internet, non invia nulla e non elimina niente senza la tua conferma.": "This app uses only official Android features. It has no Internet permission, sends nothing and deletes nothing without your confirmation.",
           "REGISTRO DI USO": "USAGE LOG",
           "RETE_E_RETI_PUBBLICHE": "NETWORK_AND_PUBLIC_WIFI",
