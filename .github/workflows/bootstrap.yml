           "Accesso a tutti i file non concesso: controllo dei file saltato.": "All-files access not granted: file check skipped.",
           "Accesso al microfono": "Microphone access",
           "Accesso alla fotocamera": "Camera access",
           "Alcuni telefoni (Xiaomi, Huawei, Samsung, Oppo…) fermano le app in background per risparmiare batteria e gli avvisi possono arrivare in ritardo. Se succede, imposta questa app su \"Nessuna restrizione\".": "Some phones (Xiaomi, Huawei, Samsung, Oppo…) stop background apps to save battery and alerts may arrive late. If this happens, set this app to \"No restrictions\".",
           "Altre app installate senza segnali rilevanti: %s": "Other installed apps with no relevant signals: %s",
           "Amministratore del dispositivo (difficile da rimuovere)": "Device administrator (hard to remove)",
           "Amministratore del dispositivo: ": "Device administrator: ",
           "Analisi dello spazio per tipo": "Storage analysis by type",
           "Analisi in corso…": "Analysis in progress…",
           "Analisi: %s / %s app": "Analysis: %s / %s apps",
           "Android non ha liberato nulla: su questo telefono il sistema non cancella le cache su richiesta. Usa la pulizia manuale dall'elenco in Pulizia.": "Android freed nothing: on this phone the system does not clear caches on request. Use manual cleaning from the list in Cleaning.",
           "Android non permette ad altre app di cancellare la cronologia dei browser. In Chrome: menu ⋮ → Elimina dati di navigazione. In Samsung Internet: menu → Impostazioni → Dati personali di navigazione → Elimina.": "Android does not let other apps delete browser history. In Chrome: menu ⋮ → Delete browsing data. In Samsung Internet: menu → Settings → Personal browsing data → Delete.",
           "Android non permette ad altre app di svuotarla in automatico. Tocca un'app per aprire la sua scheda, poi Archiviazione → Svuota cache.": "Android does not let other apps clear it automatically. Tap an app to open its page, then Storage → Clear cache.",
           "Android può tenere app e dati separati in un profilo a parte: Spazio privato (Android 15 e successivi), profilo di lavoro (usato anche da Shelter e Island) o app clonate. Questa app non crea profili: ti dice se ce ne sono e ti porta alle impostazioni.": "Android can keep apps and data separate in their own profile: Private Space (Android 15 and later), work profile (also used by Shelter and Island) or cloned apps. This app does not create profiles: it tells you if there are any and takes you to settings.",
           "Annulla": "Cancel",
           "App attive in background e batteria": "Background apps and battery",
           "App e dati": "Apps and data",
           "App senza icona e cartelle nascoste": "Apps without an icon and hidden folders",
           "Attenzione: questa app controlla solo le app del profilo principale. Le app dentro un altro profilo non vengono analizzate, quindi un'app spia lì dentro non verrebbe trovata.": "Warning: this app only checks apps in the main profile. Apps inside another profile are not analyzed, so a spy app there would not be found.",
           "Avvio…": "Starting…",
           "Avvisa anche per ogni nuova app installata da APK": "Also alert for every new app installed from an APK",
           "Avvisi in background e widget": "Background alerts and widget",
           "BATTERIA": "BATTERY",
           "BLOCCARE PUBBLICITA E TRACKER": "BLOCK ADS AND TRACKERS",
           "CACHE DELLE ALTRE APP": "CACHE OF OTHER APPS",
           "CACHE DELLE APP": "APP CACHE",
           "CARTELLE NASCOSTE CON FOTO/VIDEO": "HIDDEN FOLDERS WITH PHOTOS/VIDEOS",
           "CONSIGLI PER LE RETI PUBBLICHE": "TIPS FOR PUBLIC NETWORKS",
           "CONTROLLO_APK": "APK_CHECK",
           "CONTROLLO_IN_CORSO": "CHECK_IN_PROGRESS",
           "CONTROLLO_RAPIDO": "QUICK_CHECK",
           "CRONOLOGIA BROWSER": "BROWSER HISTORY",
           "Cache delle altre app: ": "Cache of other apps: ",
           "Cache totale delle app: ": "Total app cache: ",
           "Calendario": "Calendar",
           "Cartelle che la galleria non mostra. Alcune sono normali (cestino della galleria, dati di app di foto o di chat). Aprile con un'app di gestione file che mostri i file nascosti.": "Folders the gallery does not show. Some are normal (gallery trash, data of photo or chat apps). Open them with a file manager app that shows hidden files.",
           "Cerca file inutili e mostra cosa occupa spazio. Prima di eliminare qualsiasi cosa vedi l'elenco e ti viene chiesta conferma. Servono due permessi speciali, che concedi tu dalle impostazioni di Android.": "Looks for useless files and shows what takes up space. Before deleting anything you see the list and are asked to confirm. Two special permissions are needed, which you grant from Android settings.",
           "Cerca i file .apk nel telefono e li controlla prima che tu li installi: app spia note, firma diversa da quella dell'app già installata (possibile falso) e permessi sensibili richiesti. Non installa né elimina niente.": "Looks for .apk files on the phone and checks them before you install them: known spy apps, a signature different from the installed app (possible fake) and sensitive permissions requested. It installs and deletes nothing.",
           "Cerca le app installate senza icona nel menu e le cartelle nascoste che contengono foto o video. Sono indizi, non prove: molte app senza icona sono componenti normali. Non modifica niente.": "Looks for installed apps without a menu icon and hidden folders that contain photos or videos. These are clues, not proof: many apps without an icon are normal components. It changes nothing.",
           "Cerco i file .apk…": "Looking for .apk files…",
           "Cerco nel codice delle app installate le librerie pubblicitarie e di tracciamento più note. Può richiedere uno o due minuti.": "Looking in the code of installed apps for the best-known advertising and tracking libraries. It can take a minute or two.",
           "Chiede ad Android di fare spazio: il sistema cancella da solo le cache delle app meno usate. Non serve nessun permesso. Libera quanto serve, non necessariamente tutto, e il risultato dipende dal telefono.": "Asks Android to make room: the system itself deletes the caches of the least-used apps. No permission needed. It frees what is needed, not necessarily everything, and the result depends on the phone.",
           "Concedi almeno uno dei due permessi per iniziare.": "Grant at least one of the two permissions to start.",
           "Conferma eliminazione": "Confirm deletion",
           "Considera \"vecchi\" i file più vecchi di:": "Consider files \"old\" if older than:",
           "Contatti": "Contacts",
           "Controlla la rete a cui sei collegato usando solo le impostazioni di Android. Non invia né riceve dati, quindi non può scoprire attacchi man-in-the-middle: per quelli servirebbe analizzare il traffico di rete.": "Checks the network you are connected to using only Android settings. It neither sends nor receives data, so it cannot detect man-in-the-middle attacks: that would require analyzing network traffic.",
           "Controllo degli APK scaricati": "Check downloaded APKs",
           "Controllo il telefono…": "Checking the phone…",
           "Controllo in corso…": "Check in progress…",
           "Controllo le app installate…": "Checking installed apps…",
           "Controllo saltato: manca l'accesso a tutti i file.": "Check skipped: all-files access is missing.",
           "DA ELIMINARE": "TO DELETE",
           "DETTAGLIO PER APP": "DETAILS PER APP",
           "ELIMINAZIONE": "DELETION",
           "ERRORE": "ERROR",
           "Elenco di app spia (nomi dei pacchetti e firme): progetto stalkerware-indicators di Echap, licenza CC-BY 4.0. L'elenco è una copia inclusa nell'app e può non essere completo.": "Spy-app list (package names and signatures): stalkerware-indicators project by Echap, license CC-BY 4.0. The list is a copy included in the app and may be incomplete.",
           "Elimina": "Delete",
           "Eliminazione in corso…": "Deleting…",
           "Errore durante l'analisi.": "Error during analysis.",
           "FILE INUTILI": "USELESS FILES",
           "FILE PIU GRANDI": "LARGEST FILES",
           "FOTO DA ALTRE APP": "PHOTOS FROM OTHER APPS",
           "Facoltativo: concedi anche l'accesso alle statistiche di utilizzo (vedi [4] Pulizia) per includere lo spazio delle app.": "Optional: also grant usage-statistics access (see [4] Cleaning) to include the space used by apps.",
           "File multimediali più grandi:": "Largest media files:",
           "Fonti": "Sources",
           "Foto create da app che non sono la fotocamera. Non è per forza un problema (app di blocco che scattano il selfie a chi sbaglia il PIN, filtri, scanner).": "Photos created by apps that are not the camera. It is not necessarily a problem (lock apps that take a selfie of whoever enters the wrong PIN, filters, scanners).",
           "Foto e video": "Photos and videos",
           "Fotocamera": "Camera",
           "Il consumo preciso per app lo mostra solo Android, nelle sue impostazioni.": "Precise per-app consumption is shown only by Android, in its settings.",
           "Il tuo Android (": "Your Android (",
           "Il tuo Android lo supporta. Si attiva da Impostazioni → Sicurezza e privacy → Spazio privato: si blocca con un PIN e le sue app non compaiono nel menu né nelle notifiche quando è bloccato.": "Your Android supports it. Turn it on from Settings → Security and privacy → Private Space: it locks with a PIN and its apps do not appear in the menu or in notifications when locked.",
           "Impossibile attivare gli avvisi su questo telefono.": "Unable to enable alerts on this phone.",
           "Installata da APK con permessi sensibili: ": "Installed from an APK with sensitive permissions: ",
           "Installata fuori da un negozio ufficiale (APK manuale)": "Installed outside an official store (manual APK)",
           "LIBERA_CACHE": "FREE_CACHE",
           "Le app non sono incluse: manca l'accesso alle statistiche di utilizzo.": "Apps are not included: usage-statistics access is missing.",
           "Le chat e i messaggi non vengono toccati: se elimini un media, nella chat resta il segnaposto ma il file non è più nel telefono. Su WhatsApp si riscarica solo se è ancora sui server o in un backup; su Telegram si riscarica dal cloud (tranne le chat segrete).": "Chats and messages are not touched: if you delete a media file, the chat keeps the placeholder but the file is no longer on the phone. On WhatsApp it can be downloaded again only if it is still on the servers or in a backup; on Telegram it downloads again from the cloud (except secret chats).",
           "Legge le notifiche: ": "Reads notifications: ",
           "Leggo gli eventi di sistema…": "Reading system events…",
           "Liberi: ": "Free: ",
           "Limiti": "Limits",
           "Limiti: l'app non può leggere i dati di altre app né dimostrare che nessuno registri ciò che digiti. Se hai il fondato sospetto di un controllo nascosto, il ripristino di fabbrica è la soluzione più sicura.": "Limits: the app cannot read other apps' data nor prove that nobody records what you type. If you have a well-founded suspicion of hidden monitoring, a factory reset is the safest solution.",
           "Memoria: ": "Storage: ",
           "Microfono": "Microphone",
           "Molti file: il controllo si è fermato prima della fine.": "Many files: the check stopped before the end.",
           "Molti file: l'analisi si è fermata prima della fine.": "Many files: the analysis stopped before the end.",
           "Mostra cosa occupa lo spazio: foto, video, audio, documenti, archivi e app, con i file più grandi. Non modifica niente.": "Shows what takes up space: photos, videos, audio, documents, archives and apps, with the largest files. It changes nothing.",
           "Mostra quali app hanno tenuto attivo un servizio in primo piano (quello con la notifica fissa) e per quanto tempo, confrontato con quanto le hai usate davvero. Android non permette ad altre app di misurare la batteria per app né di chiudere i processi in modo utile: decidi tu, app per app.": "Shows which apps kept a foreground service running (the one with a fixed notification) and for how long, compared with how much you actually used them. Android does not let other apps measure battery per app or close processes usefully: you decide, app by app.",
           "Nell'elenco cerca \"GhostALO\" e accendi l'interruttore. Se è grigio o dice \"impostazione con restrizioni\" (succede alle app installate da APK): apri la scheda dell'app qui sotto, tocca i tre puntini in alto a destra, scegli \"Consenti impostazioni con restrizioni\", poi torna all'elenco.": "In the list look for \"GhostALO\" and turn on the switch. If it is gray or says \"restricted setting\" (it happens to apps installed from an APK): open the app page below, tap the three dots at the top right, choose \"Allow restricted settings\", then go back to the list.",
           "Nelle ultime %s ore, app che hanno tenuto un servizio attivo. Tocca un'app per aprire la sua scheda: lì puoi usare Batteria → Limitata, oppure Arresto forzato.": "In the last %s hours, apps that kept a service running. Tap an app to open its page: there you can use Battery → Restricted, or Force stop.",
           "Nessun accesso a Internet: i dati restano nel telefono.": "No Internet access: your data stays on the phone.",
           "Nessun controllo eseguito finora.": "No check run yet.",
           "Nessun file sopra i 20 MB.": "No files over 20 MB.",
           "Nessun indizio trovato dai controlli rapidi.": "No clues found by the quick checks.",
           "Nessuna app con segnali significativi.": "No apps with significant signals.",
           "Nessuna app non di sistema.": "No non-system apps.",
           "Nessuna voce selezionata.": "No item selected.",
           "Non ho trovato cartelle di WhatsApp o Telegram su questo telefono.": "I found no WhatsApp or Telegram folders on this phone.",
           "Non posso svuotare la cache interna di queste app (Android la protegge): per quella usa Impostazioni → App → Archiviazione → Svuota cache.": "I cannot clear the internal cache of these apps (Android protects it): for that use Settings → Apps → Storage → Clear cache.",
           "Non risultano aperte da oltre 60 giorni. Disinstallarle libera spazio. Tocca per aprire la scheda dell'app.": "They have not been opened for over 60 days. Uninstalling them frees space. Tap to open the app page.",
           "Non sono riuscito a completare il controllo.": "I could not complete the check.",
           "Non sono riuscito a leggere gli eventi di sistema.": "I could not read the system events.",
           "Non sono riuscito a leggere i file.": "I could not read the files.",
           "Non sono riuscito a leggere le cartelle.": "I could not read the folders.",
           "Ogni 30 minuti circa l'app controlla in silenzio se è comparso qualcosa di nuovo e ti manda una notifica. Controlla: app spia note, nuovi servizi di accessibilità, nuovi amministratori del dispositivo, nuovi lettori di notifiche e app installate da APK con permessi sensibili. Tutto resta nel telefono.": "About every 30 minutes the app silently checks whether anything new has appeared and sends you a notification. It checks: known spy apps, new accessibility services, new device administrators, new notification readers and apps installed from an APK with sensitive permissions. Everything stays on the phone.",
           "Oppure scegli un'area:": "Or choose an area:",
           "PER TIPO": "BY TYPE",
           "PER UN TELEFONO PIU VELOCE": "FOR A FASTER PHONE",
           "PERMESSI": "PERMISSIONS",
           "PERMESSI_CHI_USA_COSA": "PERMISSIONS_WHO_USES_WHAT",
           "PROFILI TROVATI": "PROFILES FOUND",
