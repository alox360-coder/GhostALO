              // ---------- Scansione privacy ----------

              private fun startScan() {
                  val needed = if (Build.VERSION.SDK_INT >= 33) {
                      arrayOf(
                          Manifest.permission.READ_MEDIA_IMAGES,
                          Manifest.permission.READ_MEDIA_VIDEO
                      )
                  } else {
                      arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE)
                  }
                  val missing = needed.filter {
                      checkSelfPermission(it) != PackageManager.PERMISSION_GRANTED
                  }
                  if (missing.isEmpty()) {
                      runScan()
                  } else {
                      screen = "privacyPerm"
                      requestPermissions(missing.toTypedArray(), 1)
                  }
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  val granted = grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED
                  when (requestCode) {
                      2 -> if (granted) doEnableWatch() else showWatch()
                      3 -> showWatch()
                      else -> runScan()
                  }
              }

              private fun runScan() {
                  token++
                  val my = token
                  screen = "privacy"
                  box.removeAllViews()
                  title(tr("SCANSIONE_PRIVACY"))
                  text(tr("Analisi in corso…"), size = 18f, bold = true)
                  text(tr("Può richiedere qualche secondo."), color = grey)
                  work {
                      val report = try {
                          scan()
                      } catch (e: Exception) {
                          null
                      }
                      runOnUiThread {
                          if (my == token) {
                              if (report == null) {
                                  box.removeAllViews()
                                  title(tr("ERRORE"))
                                  text(tr("Errore durante l'analisi."), color = red)
                                  button(tr("[>] Riprova")) { startScan() }
                                  backButton()
                              } else {
                                  showReport(report)
                              }
                          }
                      }
                  }
              }

