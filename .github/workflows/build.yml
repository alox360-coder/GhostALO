name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      prova:
        description: 'Prova senza chiave di firma (NON per la pubblicazione)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Le azioni sono bloccate per commit (SHA) per evitare modifiche a sorpresa.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Aggiorna l'elenco di app spia (se raggiungibile)
        continue-on-error: true
        run: python3 tools/update_stalkerware.py

      - name: Prepara la chiave di firma
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          PROVA: ${{ inputs.prova }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=yes" >> "$GITHUB_ENV"
          elif [ "$PROVA" = "true" ]; then
            echo "::warning::Build di PROVA: chiavi di firma assenti, l'APK sarà firmato con una chiave di prova."
          else
            echo "::error::Chiavi di firma mancanti: il Build si ferma. Per una prova lancia il Build a mano con l'opzione 'prova'."
            exit 1
          fi

      - name: Test automatici
        continue-on-error: true
        run: |
          if ./gradlew testDebugUnitTest --no-daemon --stacktrace; then
            echo "Test automatici: tutti passati." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Qualche test automatico non è passato: guarda il log di questo passaggio."
            echo "ATTENZIONE: qualche test automatico non è passato." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Lint (rapporto, non blocca)
        continue-on-error: true
        run: |
          ./gradlew lintRelease --no-daemon || true
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          files = glob.glob("app/build/reports/lint-results-release.xml")
          if not files:
              print("Lint: nessun rapporto prodotto.")
          else:
              issues = ET.parse(files[0]).getroot().findall("issue")
              errs = [i for i in issues if i.get("severity") in ("Error", "Fatal")]
              print("Lint: %d errori, %d avvisi in totale." % (len(errs), len(issues) - len(errs)))
              for i in errs[:25]:
                  loc = i.find("location")
                  where = (loc.get("file", "").split("/app/")[-1] + ":" + loc.get("line", "?")) if loc is not None else ""
                  print("- [%s] %s (%s)" % (i.get("id"), i.get("message", "")[:140], where))
          PY

      - name: Compila (release)
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verifica firma e crea checksum
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          cp "$APK" GhostALO.apk
          cp app/build/outputs/mapping/release/mapping.txt GhostALO-mapping.txt || echo "::warning::mapping.txt non trovato"
          sha256sum GhostALO.apk > GhostALO.apk.sha256
          cat GhostALO.apk.sha256
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs GhostALO.apk | grep -E "SHA-256" | tee -a "$GITHUB_STEP_SUMMARY" || true
          fi
          if [ "$SIGNED" = "yes" ]; then
            if [ -z "$APKSIGNER" ]; then
              echo "::error::apksigner non trovato: non posso verificare il certificato."; exit 1
            fi
            EXPECTED=$(tr -d ' :\n' < certificato.sha256 | tr 'A-F' 'a-f')
            GOT=$("$APKSIGNER" verify --print-certs GhostALO.apk | grep -m1 "certificate SHA-256 digest" | sed 's/.*: //' | tr -d ' :' | tr 'A-F' 'a-f')
            echo "Certificato atteso:   $EXPECTED"
            echo "Certificato dell'APK: $GOT"
            if [ "$GOT" != "$EXPECTED" ]; then
              echo "::error::Il certificato dell'APK NON coincide con certificato.sha256: release bloccata."; exit 1
            fi
            echo "Certificato verificato: coincide con quello atteso." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Pubblica la release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ${{ env.SIGNED == 'yes' && format('GhostALO (build {0})', github.run_number) || format('GhostALO TEST - chiave di prova (build {0})', github.run_number) }}
          prerelease: ${{ env.SIGNED != 'yes' }}
          files: |
            GhostALO.apk
            GhostALO.apk.sha256
            GhostALO-mapping.txt
