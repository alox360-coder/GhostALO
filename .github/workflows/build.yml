name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Le azioni sono bloccate per commit (SHA) per evitare modifiche a sorpresa.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Aggiorna l'elenco di app spia (se raggiungibile)
        continue-on-error: true
        run: python3 tools/update_stalkerware.py

      - name: Prepara la chiave di firma
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=yes" >> "$GITHUB_ENV"
          else
            echo "::warning::Chiavi di firma non configurate: l'APK sarà firmato con una chiave di prova."
          fi

      - name: Compila (release)
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verifica firma e crea checksum
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          cp "$APK" ControlloPrivacy.apk
          sha256sum ControlloPrivacy.apk > ControlloPrivacy.apk.sha256
          cat ControlloPrivacy.apk.sha256
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs ControlloPrivacy.apk | grep -E "SHA-256" | tee -a "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Pubblica la release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Controllo Privacy (build ${{ github.run_number }})
          prerelease: ${{ env.SIGNED != 'yes' }}
          files: |
            ControlloPrivacy.apk
            ControlloPrivacy.apk.sha256
