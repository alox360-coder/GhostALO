name: Copia di riserva della chiave

# Da eseguire UNA volta, a mano. Legge la chiave di firma gia' salvata nei Secrets,
# la cifra con la frase BACKUP_PASSPHRASE e la mette in una BOZZA di release
# (visibile solo a chi ha accesso in scrittura). La chiave non compare nei log.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepara la copia cifrata
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -e
          if [ -z "$KS_B64" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Mancano i secrets della chiave di firma."; exit 1
          fi
          if [ -z "$BACKUP_PASSPHRASE" ] || [ "${#BACKUP_PASSPHRASE}" -lt 12 ]; then
            echo "::error::Manca il secret BACKUP_PASSPHRASE o e' piu' corto di 12 caratteri."; exit 1
          fi
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          W="$RUNNER_TEMP/key"; mkdir -p "$W"
          printf '%s' "$KS_B64" | base64 -d > "$W/release.jks"

          # Controllo: la chiave si apre con la password salvata
          keytool -list -keystore "$W/release.jks" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" > /dev/null
          keytool -list -v -keystore "$W/release.jks" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" \
            | grep -E "SHA256:" | sed 's/^ *//' > "$GITHUB_WORKSPACE/impronta-certificato.txt"
          tee -a "$GITHUB_STEP_SUMMARY" < "$GITHUB_WORKSPACE/impronta-certificato.txt"

          printf 'alias: %s\nstore password: %s\nkey password: %s\n' "$KEY_ALIAS" "$STORE_PASS" "$KEY_PASS" > "$W/password.txt"
          tar -czf "$W/backup.tgz" -C "$W" release.jks password.txt
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -pass env:BACKUP_PASSPHRASE -in "$W/backup.tgz" -out "$GITHUB_WORKSPACE/ghostalo-chiave-backup.enc"
          shred -u "$W/release.jks" "$W/password.txt" "$W/backup.tgz" 2>/dev/null || rm -f "$W"/*

      - name: Salva la copia di riserva (bozza privata)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          tag_name: chiave-backup-${{ github.run_number }}
          name: COPIA DI RISERVA DELLA CHIAVE (cifrata) - non pubblicare
          body: |
            Copia di riserva cifrata della chiave di firma. Scaricala, conservala fuori da GitHub
            e NON pubblicare questa bozza. Per riaprirla serve la frase scelta in BACKUP_PASSPHRASE:
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass pass:LA_TUA_FRASE -in ghostalo-chiave-backup.enc -out backup.tgz
          files: |
            ghostalo-chiave-backup.enc
            impronta-certificato.txt
